  "components": {
    "schemas": {
      "ComposeFromErrorCode": {
        "type": "string",
        "enum": [
          "from_unknown",
          "from_unverified",
          "from_unsupported"
        ]
      },
      "ComposeFromFields": {
        "type": "object",
        "properties": {
          "account": {
            "type": "string",
            "minLength": 1,
            "maxLength": 240
          },
          "fromAddress": {
            "type": "string",
            "minLength": 3,
            "maxLength": 320,
            "pattern": "^[^\\s@<>,;\"]+@[^\\s@<>,;\"]+$"
          }
        },
        "required": [
          "account"
        ],
        "additionalProperties": false
      },
      "MobileSendAsIdentity": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "minLength": 3,
            "maxLength": 320
          },
          "displayName": {
            "type": "string",
            "maxLength": 240
          },
          "isPrimary": {
            "type": "boolean"
          },
          "isDefault": {
            "type": "boolean"
          },
          "verificationStatus": {
            "type": "string",
            "enum": [
              "accepted",
              "pending",
              "unknown"
            ]
          },
          "replyTo": {
            "type": "string",
            "maxLength": 320
          },
          "hasProviderSignature": {
            "type": "boolean"
          },
          "usable": {
            "type": "boolean"
          }
        },
        "required": [
          "email",
          "isPrimary",
          "isDefault",
          "verificationStatus",
          "hasProviderSignature",
          "usable"
        ],
        "additionalProperties": false
      },
      "MobileSendAsPage": {
        "type": "object",
        "properties": {
          "version": {
            "type": "number",
            "const": 1
          },
          "accountID": {
            "type": "string",
            "minLength": 1,
            "maxLength": 240
          },
          "aliasesSupported": {
            "type": "boolean"
          },
          "partial": {
            "type": "boolean"
          },
          "identities": {
            "minItems": 1,
            "maxItems": 100,
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "email": {
                  "type": "string",
                  "minLength": 3,
                  "maxLength": 320
                },
                "displayName": {
                  "type": "string",
                  "maxLength": 240
                },
                "isPrimary": {
                  "type": "boolean"
                },
                "isDefault": {
                  "type": "boolean"
                },
                "verificationStatus": {
                  "type": "string",
                  "enum": [
                    "accepted",
                    "pending",
                    "unknown"
                  ]
                },
                "replyTo": {
                  "type": "string",
                  "maxLength": 320
                },
                "hasProviderSignature": {
                  "type": "boolean"
                },
                "usable": {
                  "type": "boolean"
                }
              },
              "required": [
                "email",
                "isPrimary",
                "isDefault",
                "verificationStatus",
                "hasProviderSignature",
                "usable"
              ],
              "additionalProperties": false
            }
          },
          "defaultAddress": {
            "type": "string",
            "minLength": 3,
            "maxLength": 320
          },
          "serverTime": {
            "type": "string",
            "format": "date-time",
            "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$"
          }
        },
        "required": [
          "version",
          "accountID",
          "aliasesSupported",
          "partial",
          "identities",
          "defaultAddress",
          "serverTime"
        ],
        "additionalProperties": false
      },
      "AssistantRouteRequest": {
        "type": "object",
        "properties": {
          "text": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          }
        },
        "required": [
          "text"
        ],
        "additionalProperties": false
      },
      "AssistantRouteVerdict": {
        "type": "object",
        "properties": {
          "route": {
            "type": "string",
            "enum": [
              "ask",
              "hold"
            ]
          },
          "confidence": {
            "type": "number",
            "minimum": 0,
            "maximum": 1
          }
        },
        "required": [
          "route",
          "confidence"
        ],
        "additionalProperties": false
      },
      "BriefEditionKind": {
        "type": "string",
        "enum": [
          "morning",
          "manual",
          "weekly",
          "evening"
        ]
      },
      "TodaySummary": {
        "type": "object",
        "properties": {
          "version": {
            "type": "number",
            "const": 1
          },
          "reportID": {
            "type": "string",
            "minLength": 1,
            "maxLength": 240
          },
          "kind": {
            "type": "string",
            "enum": [
              "morning",
              "manual",
              "weekly",
              "evening"
            ]
          },
          "generatedAt": {
            "type": "string",
            "format": "date-time",
            "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$"
          },
          "leadLine": {
            "type": "string",
            "minLength": 1,
