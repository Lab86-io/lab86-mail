{
  "openapi": "3.1.0",
  "info": {
    "title": "Albatross Mobile API",
    "version": "1.0.0",
    "description": "Versioned query and command boundary shared by Albatross iOS and the web domain services."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
