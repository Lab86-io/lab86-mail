          "400": {
            "description": "Invalid request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MobileErrorEnvelope"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MobileErrorEnvelope"
                }
              }
            }
          },
          "409": {
            "description": "Command conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MobileErrorEnvelope"
                }
              }
            }
          },
          "429": {
            "description": "Rate limited",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MobileErrorEnvelope"
                }
              }
            }
          },
          "500": {
            "description": "Server failure",
