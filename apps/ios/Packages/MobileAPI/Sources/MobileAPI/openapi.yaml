    "/api/mobile/v1/mail/threads": {
      "get": {
        "operationId": "getMobileMailThreads",
        "parameters": [
          {
            "name": "accountID",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "category",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 240
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "description": "Opaque page cursor from a previous response (a decimal epoch-ms watermark).",
            "schema": {
              "type": "string",
              "pattern": "^\\d+$"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100
            }
          }
        ],
        "responses": {
          "200": {
            "description": "One page of thread summaries",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MailThreadPage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MobileErrorEnvelope"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MobileErrorEnvelope"
                }
              }
            }
          },
          "409": {
            "description": "Command conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MobileErrorEnvelope"
                }
              }
            }
          },
          "429": {
