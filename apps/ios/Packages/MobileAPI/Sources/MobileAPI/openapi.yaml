                "schema": {
                  "$ref": "#/components/schemas/MobileErrorEnvelope"
                }
              }
            }
          },
          "500": {
            "description": "Server failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MobileErrorEnvelope"
                }
              }
            }
          }
        }
      }
    },
