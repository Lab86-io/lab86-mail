name: Lab86Mail

options:
  bundleIdPrefix: io.lab86
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  xcodeVersion: "27.0"

packages:
  MobileAPI:
    path: Packages/MobileAPI
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    # Upstream 2.13.6 plus the reviewed Swift 6.4 optimizer workaround for
    # swiftlang/swift#90408. Pin the commit exactly until the next release.
    revision: 8d6ad267714cac3ae747cefdd21f7a6665006e1f
  SwiftStreamingMarkdown:
    url: https://github.com/microsoft/SwiftStreamingMarkdown
    # v0.6.0 still declares a branch-pinned HighlightSwift dependency, which
    # SwiftPM rejects when the root uses a stable version. Pin the reviewed
    # v0.6.0-era revision exactly so builds are reproducible.
    revision: a4187829013c4588556d82dbf1ab65ed768a0262
  HorizonCalendar:
    url: https://github.com/airbnb/HorizonCalendar
    from: 2.0.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 8.1.0
  Clerk:
    url: https://github.com/clerk/clerk-ios
    # 1.3.3 fixes the AuthView startup race and automatic passkey failures
    # that could terminate the app as the signed-out flow was presented.
    from: 1.3.3
  ClerkConvex:
    url: https://github.com/clerk/clerk-convex-swift
    exactVersion: 0.1.0
  Convex:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.1

settings:
  base:
    DEVELOPMENT_TEAM: 5JZV7V6Y4Z
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Lab86Mail:
    type: application
    platform: iOS
    sources:
      - path: Lab86Mail
      # Compiled into the app and the AutoFill extension both. The extension is
      # a separate process with its own memory budget, so this stays a small set
      # of dependency-free types rather than becoming a shared framework.
      - path: Shared
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lab86.mail
        PRODUCT_NAME: Albatross
        PRODUCT_MODULE_NAME: Lab86Mail
        INFOPLIST_FILE: Lab86Mail/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lab86Mail/Resources/Lab86Mail.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: true
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_MACCATALYST: false
    postBuildScripts:
      - name: Verify embedded release configuration
        script: '"$SRCROOT/ci_scripts/verify_built_configuration.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/ci_scripts/verify_built_configuration.sh
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
    dependencies:
      - package: MobileAPI
        product: MobileAPI
      - package: SwiftSoup
        product: SwiftSoup
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
      - package: HorizonCalendar
        product: HorizonCalendar
      - package: Kingfisher
        product: Kingfisher
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: ClerkConvex
        product: ClerkConvex
      - package: Convex
        product: ConvexMobile
      - target: Lab86MailAutoFill
    scheme:
      testTargets:
        - Lab86MailTests
        - Lab86MailUITests
      gatherCoverageData: true

  # The same product, native on the Mac. Shares the Lab86Mail sources and the
  # Lab86Mail module name wholesale; Mac-only shell code and resources live in
  # Lab86MailMac/. Same bundle identifier as iOS for universal purchase and so
  # the existing associated-domain registrations (TEAMID.io.lab86.mail) apply.
  # HorizonCalendar is UIKit-only and deliberately absent — its call sites are
  # gated with canImport(HorizonCalendar).
  Lab86MailMac:
    type: application
    platform: macOS
    sources:
      # The iOS Info.plist is the iOS target's INFOPLIST_FILE, not a resource:
      # left in, XcodeGen copies it verbatim (placeholders and all) into
      # Contents/Resources, and App Store Connect rejects the Mac upload as a
      # nested bundle with an invalid identifier (ITMS-90277/90261/90280).
      - path: Lab86Mail
        excludes:
          - "Resources/Info.plist"
      - path: Shared
      - path: Lab86MailMac
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lab86.mail
        PRODUCT_NAME: Albatross
        PRODUCT_MODULE_NAME: Lab86Mail
        INFOPLIST_FILE: Lab86MailMac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lab86MailMac/Resources/Lab86MailMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
    postBuildScripts:
      - name: Verify embedded release configuration
        script: '"$SRCROOT/ci_scripts/verify_built_configuration.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/ci_scripts/verify_built_configuration.sh
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
    dependencies:
      - package: MobileAPI
        product: MobileAPI
      - package: SwiftSoup
        product: SwiftSoup
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
      - package: Kingfisher
        product: Kingfisher
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: ClerkConvex
        product: ClerkConvex
      - package: Convex
        product: ConvexMobile
      - target: Lab86MailMacAutoFill
    scheme:
      testTargets:
        - Lab86MailMacTests
      gatherCoverageData: true

  # The same one-time-code AutoFill provider, for the Mac (macOS 15 added
  # third-party one-time-code providers). Shares the iOS extension's sources
  # and Info.plist wholesale; only the sandboxed entitlements differ.
  Lab86MailMacAutoFill:
    type: app-extension
    platform: macOS
    sources:
      - path: Lab86MailAutoFill
      - path: Shared
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lab86.mail.autofill
        PRODUCT_NAME: Lab86MailAutoFill
        PRODUCT_MODULE_NAME: Lab86MailAutoFill
        INFOPLIST_FILE: Lab86MailAutoFill/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lab86MailAutoFill/Resources/Lab86MailMacAutoFill.entitlements
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false

  Lab86MailMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Lab86MailTests
    dependencies:
      - target: Lab86MailMac
      - package: MobileAPI
        product: MobileAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lab86.mail.mactests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Albatross.app/Contents/MacOS/Albatross
        BUNDLE_LOADER: $(TEST_HOST)

  # Supplies one-time codes from mail to system AutoFill. Deliberately depends
  # on nothing but the shared vault types: it runs in a short-lived, memory
  # constrained process and reads only what the app has already fetched.
  Lab86MailAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: Lab86MailAutoFill
      - path: Shared
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lab86.mail.autofill
        PRODUCT_NAME: Lab86MailAutoFill
        PRODUCT_MODULE_NAME: Lab86MailAutoFill
        INFOPLIST_FILE: Lab86MailAutoFill/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lab86MailAutoFill/Resources/Lab86MailAutoFill.entitlements
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_MACCATALYST: false

  Lab86MailTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Lab86MailTests
    dependencies:
      - target: Lab86Mail
      - package: MobileAPI
        product: MobileAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lab86.mail.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Albatross.app/Albatross
        BUNDLE_LOADER: $(TEST_HOST)

  Lab86MailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Lab86MailUITests
    dependencies:
      - target: Lab86Mail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lab86.mail.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Lab86Mail
