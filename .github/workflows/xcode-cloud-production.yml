name: Xcode Cloud production trigger

on:
  workflow_run:
    workflows:
      - Deploy Production
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Deploy Production workflow run containing the immutable release identity
        required: true
        type: string

concurrency:
  group: xcode-cloud-production-trigger
  cancel-in-progress: false

jobs:
  start-xcode-cloud:
    name: Build production iOS and distribute to TestFlight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 90
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve production deployment run
        id: deploy
        env:
          AUTOMATIC_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          deploy_run_id="${AUTOMATIC_RUN_ID:-${MANUAL_RUN_ID:-}}"
          if ! [[ "$deploy_run_id" =~ ^[0-9]+$ ]]; then
            echo "A numeric successful Deploy Production run id is required." >&2
            exit 1
          fi
          echo "run_id=$deploy_run_id" >> "$GITHUB_OUTPUT"

      - name: Download immutable production release identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-release-${{ steps.deploy.outputs.run_id }}
          path: ${{ runner.temp }}/production-release
          github-token: ${{ github.token }}
          run-id: ${{ steps.deploy.outputs.run_id }}

      - name: Resolve immutable production release
        id: release
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/production-release/production-release.json"
          release_sha="$(jq -er '.releaseSha' "$identity")"
          release_ref="$(jq -er '.releaseRef' "$identity")"
          version="$(jq -er '.version' "$identity")"
          if ! [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The production release artifact contains an invalid commit SHA." >&2
            exit 1
          fi
          if [ "$release_ref" != "v${version}" ]; then
            echo "The production release tag does not match version ${version}." >&2
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "git_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out release automation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check out the production commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          path: release-source
          ref: ${{ steps.release.outputs.sha }}

      - name: Verify immutable production release
        run: |
          set -euo pipefail
          release_repo="$GITHUB_WORKSPACE/release-source"
          release_sha="${{ steps.release.outputs.sha }}"
          release_ref="${{ steps.release.outputs.git_ref }}"
          test "$(git -C "$release_repo" rev-parse HEAD)" = "$release_sha"
          git -C "$release_repo" fetch --force origin main "refs/tags/${release_ref}:refs/tags/${release_ref}"
          test "$(git -C "$release_repo" rev-list -n 1 "$release_ref")" = "$release_sha"
          git -C "$release_repo" merge-base --is-ancestor "$release_sha" origin/main
          test "$(git -C "$release_repo" show "${release_sha}:package.json" | jq -r '.version')" = "${{ steps.release.outputs.version }}"

      - name: Verify release automation
        run: |
          node --test .github/scripts/app-store-connect.test.mjs
          node --test .github/scripts/xcode-cloud-artifacts.test.mjs
          node --test .github/scripts/xcode-cloud-diagnostics.test.mjs
          node --test .github/scripts/upload-ios-export.test.mjs
          node --test .github/scripts/xcode-cloud-workflows.test.mjs
          bash apps/ios/ci_scripts/ci_post_clone_test.sh
          apps/ios/ci_scripts/verify_built_configuration_test.sh

      - name: Start production Xcode Cloud build
        id: start
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APP_STORE_APP_ID: 6792830834
          XCODE_CLOUD_WORKFLOW_NAME: Production App Store
          XCODE_CLOUD_BRANCH_NAME: main
          XCODE_CLOUD_GIT_REF_NAME: refs/tags/${{ steps.release.outputs.git_ref }}
          XCODE_CLOUD_TEMPLATE_WORKFLOW_ID: 304D20E5-2087-4E0D-8A6E-5E6025DEED36
        run: node .github/scripts/start-xcode-cloud.mjs

      - name: Wait for Xcode Cloud export
        id: xcode_cloud
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          XCODE_CLOUD_BUILD_RUN_ID: ${{ steps.start.outputs.build_run_id }}
          XCODE_CLOUD_DIAGNOSTICS_DIR: ${{ runner.temp }}/xcode-cloud-diagnostics
        run: node .github/scripts/wait-for-xcode-cloud.mjs

      - name: Preserve failed Xcode Cloud diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcode-cloud-production-diagnostics-${{ steps.start.outputs.build_number }}
          path: ${{ runner.temp }}/xcode-cloud-diagnostics
          if-no-files-found: ignore
          retention-days: 1

      - name: Download Xcode Cloud App Store export
        if: steps.xcode_cloud.outputs.artifact_url != ''
        env:
          ARTIFACT_URL: ${{ steps.xcode_cloud.outputs.artifact_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/xcode-cloud-app-store"
          curl --fail --location \
            --connect-timeout 30 \
            --max-time 1800 \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            "$ARTIFACT_URL" --output "$RUNNER_TEMP/xcode-cloud-app-store.zip"
          unzip -q "$RUNNER_TEMP/xcode-cloud-app-store.zip" -d "$RUNNER_TEMP/xcode-cloud-app-store"

      - name: Verify signed production IPA
        if: steps.xcode_cloud.outputs.artifact_url != ''
        run: .github/scripts/verify-ios-export.sh production "$RUNNER_TEMP/xcode-cloud-app-store"

      - name: Upload production export to App Store Connect
        if: steps.xcode_cloud.outputs.needs_upload == 'true'
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ steps.start.outputs.build_number }}
        run: |
          ipa_path=$(find "$RUNNER_TEMP/xcode-cloud-app-store" -type f -name '*.ipa' -print -quit)
          if [ -z "$ipa_path" ]; then
            echo "The production Xcode Cloud export did not contain an IPA." >&2
            exit 1
          fi

          IPA_PATH="$ipa_path" node .github/scripts/upload-ios-export.mjs

      - name: Confirm production TestFlight processing and internal group assignment
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APP_STORE_APP_ID: 6792830834
          TESTFLIGHT_GROUP_ID: 4606fec2-432b-4875-93dc-8f4a3982f6e0
          BUILD_NUMBER: ${{ steps.start.outputs.build_number }}
        run: node .github/scripts/wait-for-testflight.mjs
