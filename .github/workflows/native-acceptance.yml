name: Native acceptance

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/native-acceptance.yml'
      - '.github/scripts/native-acceptance.sh'
      - '.github/scripts/native-tour-gallery.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.platform }} build and checks
    # Xcode 27's image contains the iOS 27 simulator and the macOS 27 SDK.
    # The Mac job also runs the Mac tour on the host (sw_vers shows its OS).
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Generate native project
        run: |
          brew install xcodegen
          xcodegen generate --spec apps/ios/project.yml
          xcodebuild -version
          sw_vers
      - name: Build and verify
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: bash .github/scripts/native-acceptance.sh "$NATIVE_PLATFORM"
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.platform }}-${{ github.sha }}
          path: |
            native-evidence/
            !native-evidence/tour/
            apps/ios/Lab86Mail.xcodeproj/project.pbxproj
          retention-days: 7
      - name: Preserve the screenshot tour
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-tour-${{ matrix.platform }}-${{ github.sha }}
          path: native-evidence/tour/
          if-no-files-found: warn
          retention-days: 7

  tour:
    name: Native screenshot tour gallery
    needs: native
    # The gallery also shows what a failed run managed to draw.
    if: always()
    runs-on: ${{ vars.WEB_WORKFLOW_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Test the gallery script
        run: node --test .github/scripts/native-tour-gallery.test.mjs
      - name: Download the tour images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-tour-*-${{ github.sha }}
          path: native-tour-input
      - name: Build the gallery
        env:
          TOUR_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/native-tour-gallery.mjs native-tour-input native-evidence/tour
      - name: Preserve the gallery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-tour
          path: native-evidence/tour/
          if-no-files-found: error
          retention-days: 14
