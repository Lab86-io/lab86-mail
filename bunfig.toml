[test]
# Keep coverage focused on application logic rather than generated or UI-only code.
coveragePathIgnorePatterns = [
  "**/*.d.ts",
  "**/node_modules/**",
  "components/**",
  "app/**",
  "convex/_generated/**",
  "scripts/**",
]

# Used only by the synthetic Bun HTML dev server; Next builds use their own config.
[serve.static]
plugins = ["./scripts/fixtures/preview-providers.mjs"]
env = "disable"
